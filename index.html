<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pdfTools</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <i class="fa-solid fa-file-pdf"></i>
            <span>pdfTools</span>
        </div>

        <nav>

            <a href="#" class="menu active" data-page="home">
                <i class="fa-solid fa-house"></i>
                <span>Beranda</span>
            </a>

            <a href="#" class="menu" data-page="reader">
                <i class="fa-solid fa-book-open-reader"></i>
                <span>Buka PDF</span>
            </a>

            <a href="#" class="menu" data-page="editor">
                <i class="fa-solid fa-pen"></i>
                <span>Edit PDF</span>
            </a>

            <a href="#" class="menu" data-page="templates">
                <i class="fa-solid fa-file-lines"></i>
                <span>Template</span>
            </a>

            <a href="#" class="menu" data-page="documents">
                <i class="fa-solid fa-folder-open"></i>
                <span>Dokumen</span>
            </a>

            <a href="#" class="menu" data-page="settings">
                <i class="fa-solid fa-gear"></i>
                <span>Pengaturan</span>
            </a>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="main">

        <header class="topbar">

            <button id="toggleSidebar">
                <i class="fa-solid fa-bars"></i>
            </button>

            <h4 id="pageTitle">Dashboard</h4>

        </header>

        <section id="workspace">

            <div class="welcome">

                <i class="fa-solid fa-file-pdf"></i>

                <h2>Selamat Datang di pdfTools</h2>

                <p>
                    Aplikasi PDF Reader, Editor, dan Generator Dokumen.
                </p>

            </div>

        </section>

    </main>

</div>

<script src="assets/js/router.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
